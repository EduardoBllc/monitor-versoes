name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portao:
    # O nome do job e o nome do check que a protecao da main exige: mudar
    # `etapa` aqui exige atualizar o ruleset junto.
    name: ${{ matrix.etapa }}
    runs-on: ${{ matrix.so || 'ubuntu-26.04' }}
    strategy:
      # Cada etapa reporta sozinha: um format quebrado nao esconde o pytest.
      fail-fast: false
      matrix:
        # Cada etapa e um alvo do Makefile; `make check` roda os mesmos alvos,
        # na mesma ordem. O comando vive so no Makefile.
        include:
          - etapa: ruff format
            alvo: fmt-check
          - etapa: ruff check
            alvo: lint
          - etapa: mypy
            alvo: typecheck
          - etapa: pytest
            alvo: test
          - etapa: pytest windows
            alvo: test
            so: windows-latest
          - etapa: web check
            alvo: web-check
            node: true
          - etapa: web dist
            alvo: web-dist
            node: true
          - etapa: web e2e
            alvo: web-e2e
            node: true
    env:
      # O `uv run` do Makefile falha em vez de reescrever um uv.lock desatualizado.
      UV_LOCKED: "1"
      UV_COMPILE_BYTECODE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7.1.0
        if: matrix.node
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # O runner Windows não tem `make`; o comando continua só no Makefile.
      - run: choco install make --no-progress
        if: runner.os == 'Windows'
      - name: Defender (medição)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List
          Set-MpPreference -DisableRealtimeMonitoring $true
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled | Format-List
      - run: uv sync --all-extras --locked --python 3.14
      # O Chromium baixado depende só da versão do Playwright travada no lock.
      - id: playwright
        if: matrix.alvo == 'web-e2e'
        run: echo "versao=$(jq -r '.packages["node_modules/@playwright/test"].version' web/package-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        if: matrix.alvo == 'web-e2e'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}
      # O navegador e as libs de sistema dele não vêm no `npm ci`; o `npm ci`
      # antes garante que o `npx` use a versão travada no lock.
      - run: cd web && npm ci && npx playwright install --with-deps chromium
        if: matrix.alvo == 'web-e2e'
      - run: make ${{ matrix.alvo }}

  instalador-windows:
    # Fora da matriz e dos checks exigidos: baixa a última release e liga e
    # desliga o Agendador de Tarefas de verdade.
    name: instalador windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - name: PSScriptAnalyzer
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          # O -Path recebe um caminho só.
          $achados = 'install.ps1', 'motor/ajudante_windows.ps1' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ }
          $achados | Format-Table -AutoSize
          if ($achados) { exit 1 }

      - name: install.ps1 -SemConfigurar (PowerShell 5.1)
        env: &ambiente-51
          LOCALAPPDATA: ${{ runner.temp }}\ps51\local
          APPDATA: ${{ runner.temp }}\ps51\roaming
          UV_TOOL_DIR: ${{ runner.temp }}\ps51\tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}\ps51\bin
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -SemConfigurar
      - name: "--version da release (PowerShell 5.1)"
        env: *ambiente-51
        run: '& "$env:UV_TOOL_BIN_DIR\monitor-versoes.exe" --version'
      - name: install.ps1 -Desinstalar (PowerShell 5.1)
        env: *ambiente-51
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Desinstalar

      - name: install.ps1 -SemConfigurar (PowerShell 7)
        env: &ambiente-7
          LOCALAPPDATA: ${{ runner.temp }}\ps7\local
          APPDATA: ${{ runner.temp }}\ps7\roaming
          UV_TOOL_DIR: ${{ runner.temp }}\ps7\tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}\ps7\bin
        run: pwsh -NoProfile -File install.ps1 -SemConfigurar
      - name: "--version da release (PowerShell 7)"
        env: *ambiente-7
        run: '& "$env:UV_TOOL_BIN_DIR\monitor-versoes.exe" --version'
      - name: install.ps1 -Desinstalar (PowerShell 7)
        env: *ambiente-7
        run: pwsh -NoProfile -File install.ps1 -Desinstalar

      - run: uv sync --all-extras --locked --python 3.14
      # Os testes leem os mesmos UV_TOOL_DIR e UV_TOOL_BIN_DIR do motor instalado aqui.
      - name: motor do commit como uv tool
        shell: bash
        env:
          LOCALAPPDATA: ${{ runner.temp }}\integracao\local
          APPDATA: ${{ runner.temp }}\integracao\roaming
          UV_TOOL_DIR: ${{ runner.temp }}\integracao\tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}\integracao\bin
        run: uv tool install --python 3.14 "monitor-versoes @ git+file:///$(pwd -W)@$(git rev-parse HEAD)"
      - name: integração do serviço e da reinstalação
        shell: bash
        # Sem LOCALAPPDATA e APPDATA: o `conftest` os troca pelo `tmp_path` de cada teste.
        env:
          UV_TOOL_DIR: ${{ runner.temp }}\integracao\tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}\integracao\bin
          UV_LOCKED: "1"
          MONITOR_VERSOES_INTEGRACAO_WINDOWS: "1"
        # Teste pulado é conferência que não aconteceu: o passo falha.
        run: |
          uv run pytest tests/test_windows_integracao.py -rs | tee "$RUNNER_TEMP/pytest.txt"
          if grep -q SKIPPED "$RUNNER_TEMP/pytest.txt"; then
            echo "::error::teste de integração pulado"
            exit 1
          fi
