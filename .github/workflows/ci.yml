name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portao:
    # O nome do job e o nome do check que a protecao da main exige: mudar
    # `etapa` aqui exige atualizar o ruleset junto.
    name: ${{ matrix.etapa }}
    runs-on: ubuntu-latest
    strategy:
      # Cada etapa reporta sozinha: um format quebrado nao esconde o pytest.
      fail-fast: false
      matrix:
        # Cada etapa e um alvo do Makefile; `make check` roda os mesmos alvos,
        # na mesma ordem. O comando vive so no Makefile.
        include:
          - etapa: ruff format
            alvo: fmt-check
          - etapa: ruff check
            alvo: lint
          - etapa: mypy
            alvo: typecheck
          - etapa: pytest
            alvo: test
    env:
      # O `uv run` do Makefile falha em vez de reescrever um uv.lock desatualizado.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --all-extras --locked --python 3.14
      - run: make ${{ matrix.alvo }}
