name: Revisão IA

# Push no PR do agente gera nova revisão, que acorda o agente de novo: o laço para no
# veredito ou no limite de rodadas da skill (execucao.md).
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  revisao:
    # O PR de release (branch release-please--*) é mecânico e aberto pelo App: revisá-lo
    # acordaria o agente para corrigir um diff que é só número e changelog (decisão 038).
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
       !startsWith(github.head_ref, 'release-please--') &&
       (github.event.action != 'synchronize' ||
        github.event.pull_request.user.login == format('{0}[bot]', vars.AGENTE_APP_SLUG))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude review') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
      issues: read
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      # No issue_comment o checkout é da main, não do PR: o diff vem do `gh pr diff`.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Token do próprio job, limitado pelas `permissions`: dispensa instalar o GitHub App do Claude.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # O PR do agente é aberto pelo bot do App; sem listá-lo a action rejeita o actor.
          allowed_bots: ${{ vars.AGENTE_APP_SLUG }}
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ env.PR }}/comments:*)"
          prompt: |
            Revise o PR #${{ env.PR }} do repositório ${{ github.repository }}. Escreva em português.

            1. Leia o diff com `gh pr diff ${{ env.PR }}` e a descrição com `gh pr view ${{ env.PR }}`.
            2. Leia as revisões anteriores: os resumos com `gh pr view ${{ env.PR }} --comments` e as
               threads de linha com `gh api repos/${{ github.repository }}/pulls/${{ env.PR }}/comments --paginate`.
               Não repita apontamento já atendido ou respondido com justificativa, a menos que a
               resposta não se sustente; nesse caso, diga por quê.
            3. Se a descrição tiver `Closes #M`, leia a issue com `gh issue view M` e confira os
               critérios de aceite. Se não tiver, diga que não há issue vinculada e não invente critérios.
            4. Confira o diff contra `AGENTS.md`, `docs/padroes/codigo.md`, `docs/padroes/testes.md` e,
               quando o diff tocar no assunto de alguma decisão, `docs/decisoes/`. Leia esses arquivos
               do working tree.
            5. Aponte cada problema pontual na linha dele com
               `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`).
            6. Termine com um único `gh pr comment ${{ env.PR }}` de resumo, contendo a linha
               `**Veredito:** aprovaria` ou `**Veredito:** mudanças sugeridas`.
            7. Não submeta review do tipo "request changes" e não altere arquivos.
