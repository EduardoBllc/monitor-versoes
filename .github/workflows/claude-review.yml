name: Revisão IA

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  revisao:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude review') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      # No issue_comment o checkout é da main, não do PR: o diff vem do `gh pr diff`.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Token do próprio job, limitado pelas `permissions`: dispensa instalar o GitHub App do Claude.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # O PR do agente é aberto pelo bot do App; sem listá-lo a action rejeita o actor.
          allowed_bots: ${{ vars.AGENTE_APP_SLUG }}
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
          prompt: |
            Revise o PR #${{ env.PR }} do repositório ${{ github.repository }}. Escreva em português.

            1. Leia o diff com `gh pr diff ${{ env.PR }}` e a descrição com `gh pr view ${{ env.PR }}`.
            2. Se a descrição tiver `Closes #M`, leia a issue com `gh issue view M` e confira os
               critérios de aceite. Se não tiver, diga que não há issue vinculada e não invente critérios.
            3. Confira o diff contra `AGENTS.md`, `docs/padroes/codigo.md`, `docs/padroes/testes.md` e,
               quando o diff tocar no assunto de alguma decisão, `docs/decisoes/`. Leia esses arquivos
               do working tree.
            4. Aponte cada problema pontual na linha dele com
               `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`).
            5. Termine com um único `gh pr comment ${{ env.PR }}` de resumo, contendo a linha
               `**Veredito:** aprovaria` ou `**Veredito:** mudanças sugeridas`.
            6. Não submeta review do tipo "request changes" e não altere arquivos.
