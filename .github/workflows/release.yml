name: Release

# Mantém o PR de release (versão no pyproject.toml e no uv.lock, CHANGELOG.md e número no README);
# mergeá-lo cria a tag vX.Y.Z e a GitHub Release. Ver docs/decisoes/039.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-26.04
    steps:
      # Token do App, não o GITHUB_TOKEN: PR aberto pelo GITHUB_TOKEN não dispara o CI,
      # e a ruleset da main exige os checks dele para mergear o PR de release.
      - uses: actions/create-github-app-token@v3.3.0
        id: app
        with:
          client-id: ${{ secrets.AGENTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # O uv.lock guarda a versão do próprio projeto e o CI roda `uv sync --locked`. O updater
      # de TOML do release-please não acha a entrada no uv.lock, então o lock é regerado aqui,
      # na branch do PR de release aberto. Procura pela label, e não pelo output `pr` da action,
      # que só vem quando o PR é criado ou alterado: um push na main sem `feat`/`fix` deixa o
      # PR igual e não o informaria.
      - name: Branch do PR de release
        id: branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          nome=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --label 'autorelease: pending' \
            --json headRefName --jq '.[0].headRefName // ""')
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        if: steps.branch.outputs.nome != ''
        with:
          ref: ${{ steps.branch.outputs.nome }}
          token: ${{ steps.app.outputs.token }}
      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.branch.outputs.nome != ''
      - name: uv.lock na versão nova
        if: steps.branch.outputs.nome != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          uv lock
          git diff --quiet uv.lock && exit 0
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git commit -m "chore: uv.lock na versão do release" uv.lock
          git push
