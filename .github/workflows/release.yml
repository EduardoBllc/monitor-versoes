name: Release

# Mantém o PR de release (versão no pyproject.toml e no uv.lock, CHANGELOG.md e número no README);
# mergeá-lo cria a tag vX.Y.Z e a GitHub Release. Ver docs/decisoes/039.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-26.04
    steps:
      # Token do App, não o GITHUB_TOKEN: PR aberto pelo GITHUB_TOKEN não dispara o CI,
      # e a ruleset da main exige os checks dele para mergear o PR de release.
      - uses: actions/create-github-app-token@v3.3.0
        id: app
        with:
          client-id: ${{ secrets.AGENTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5.0.0
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # O uv.lock guarda a versão do próprio projeto e o CI roda `uv sync --locked`. O updater
      # de TOML do release-please não acha a entrada no uv.lock, então o lock é regerado aqui,
      # na branch do PR de release, a cada vez que o release-please a reescreve.
      - uses: actions/checkout@v7.0.1
        if: steps.rp.outputs.pr
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
          token: ${{ steps.app.outputs.token }}
      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.rp.outputs.pr
      - name: uv.lock na versão nova
        if: steps.rp.outputs.pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          uv lock
          git diff --quiet uv.lock && exit 0
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git commit -m "chore: uv.lock na versão do release" uv.lock
          git push
