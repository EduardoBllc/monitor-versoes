[project]
name = "monitor-versoes-gitlab"
version = "0.1.0"
description = "Fonte de tarefas do monitor-versoes para o GitLab Issues"
requires-python = ">=3.14"
dependencies = ["monitor-versoes", "httpx"]

[project.entry-points."monitor_versoes.tarefas"]
gitlab = "monitor_versoes_gitlab:FonteGitlab"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["monitor_versoes_gitlab*"]

[tool.uv.sources]
monitor-versoes = { workspace = true }
