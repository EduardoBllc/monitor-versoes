[project]
name = "monitor-versoes"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = [
    "httpx",
    "python-dotenv",
    "textual>=8.2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "desktop-notifier>=6.2.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff>=0.17.1",
    "pre-commit>=4.7.0",
    "httpx2>=2.16.0",
]
anthropic = [
    "anthropic>=2.8,<3",
]

[project.scripts]
monitor-versoes = "motor.__main__:main"

# Sem console no Windows: o que a tarefa agendada das inscrições chama.
[project.gui-scripts]
monitor-versoes-inscricoes = "motor.__main__:main_inscricoes"

[project.entry-points."monitor_versoes.esquemas"]
semver = "motor.esquemas.semver:Semver"

[project.entry-points."monitor_versoes.prs"]
bitbucket = "motor.adapters.commitsource.bitbucket:BitbucketPrs"

[project.entry-points."monitor_versoes.sugestao"]
anthropic = "motor.adapters.sugestao.anthropic:ProvedorAnthropic"

[project.entry-points."monitor_versoes.atribuicoes"]
exata = "motor.atribuicoes:Exata"
composta = "motor.atribuicoes:Composta"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motor*"]

[tool.setuptools.package-data]
motor = ["migracoes/script.py.mako", "migracoes/versions/*.py", "daemon/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# O type checker e o que faz "adapter nao cumpre a porta" virar erro em vez de
# surpresa em runtime: Protocol e estrutural, e a conformidade e verificada nos
# pontos de atribuicao (motor/montagem.py e tests/test_conformidade.py).
[tool.mypy]
python_version = "3.14"
files = ["motor", "tests"]
strict = true

# Corpo de funcao de teste sem anotacao e ruido, nao defeito: exigir assinatura
# em toda funcao `test_*` rende centenas de erros que nao dizem nada. O que
# importa em `tests/` e o resto do strict — sobretudo argumento de tipo errado
# na construcao de `Deps` e de dataclass do dominio, que e a classe de erro que
# este projeto ja deixou passar por quatro tasks.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# textual e dotenv nao publicam stubs completos.
[[tool.mypy.overrides]]
module = ["textual.*", "dotenv.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"

# PLR1702 e preview; explicit-preview-rules liga so ela, nao toda regra preview
# que caiba nos prefixos do select.
[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E4", "E7", "E9", "F", "B", "UP", "I", "SIM", "RUF", "PLW", "PLR2004",
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR1702",
]

# Numero literal em assert de teste e o valor esperado, nao numero magico.
# Fixture do pytest entra como argumento: contar argumentos ali nao mede complexidade.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913"]
