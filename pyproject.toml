[project]
name = "motor-versoes"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx",
    "python-dotenv",
    "textual>=8.2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
motor = "motor.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracao: exige Postgres de pe (pulado sem DATABASE_HOST no ambiente)",
]
